info:
  name: Change Password (Authenticated)
  type: http
  seq: 8

http:
  method: POST
  url: https://neethu.astradevelops.in/school/public/api/password/change
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer "
  body:
    type: json
    data: |-
      {
        "current_password": "password123",
        "new_password": "NewSecurePassword@123",
        "new_password_confirmation": "NewSecurePassword@123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
